# Version updates: once a week, one pull request for the actions of the workflows (grouped), built and tested by CI like any other change.
# Security updates are not set here: Dependabot raises them from the repository's own setting, for the default branch, as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
